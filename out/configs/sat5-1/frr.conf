frr defaults datacenter
hostname sat5-1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ipv6 address fcbb:5:1::1/128
!
interface eth1
 description ISL
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
!
interface eth2
 description ISL
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
!
interface eth3
 description ISL
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
!
interface eth4
 description ISL
 no ipv6 nd suppress-ra
 ipv6 nd ra-interval 5
!
ipv6 route fcbb:5:1::/48 blackhole
!
router bgp 4200005001
 bgp router-id 10.5.1.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor ISL peer-group
 neighbor ISL remote-as external
 neighbor ISL timers 3 9
 neighbor eth1 interface peer-group ISL
 neighbor eth2 interface peer-group ISL
 neighbor eth3 interface peer-group ISL
 neighbor eth4 interface peer-group ISL
 !
 address-family ipv6 unicast
  redistribute connected
  redistribute static
  neighbor ISL activate
  maximum-paths 6
 exit-address-family
!
segment-routing
 srv6
  locators
   locator MAIN
    prefix fcbb:5:1::/48 block-len 32 node-len 16 func-bits 16
   exit
  exit
 exit
exit
!
line vty
!
