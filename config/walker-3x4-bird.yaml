# Walker Delta 星座: 3 轨道面 x 4 卫星, 控制面使用 BIRD2 (node.routing 选择)
# 几何参数与 walker-3x4.yaml 一致, 仅协议栈与实验室名不同
constellation:
  name: sat-3x4b
  planes: 3
  sats_per_plane: 4
  altitude_km: 3000.0       # 每面仅 4 星(相邻 90°), 低轨同轨弦线会穿地球;
                            # 90° 弦近地点 r*cos45-6371 需 >80km => 高度≥2760km
  inclination_deg: 53.0
  raan_spread_deg: 360.0    # Walker Delta, 轨道面环闭合
  phase_factor: 1
  epoch_offset_s: 0.0

isl:
  rate_mbps: 100
  links_per_sat: 4          # 前/后/左/右各 1 (3 面构型面环闭合恰好成立)
  wrap_planes: true
  polar_cutoff_lat_deg: 0   # 倾角 53 度无极区
  los_margin_km: 80
  max_range_km: 14000       # 最大建链距离: 同轨 13253km 恒定(骨干保留);
                            # 异轨 3774~17570km, 超限段周期性断链
  static_delay_ms: 0

node:
  kind: linux
  image: sat-router:latest
  routing: bird2            # 路由协议栈: frr(默认) / bird2
  mgmt_subnet: 172.101.0.0/16  # 与 FRR 版 (172.100) 错开, 支持两 lab 共存

simulation:
  step_seconds: 15          # 12 节点规模小, 步长可短
  speedup: 1.0
  delay_eps_ms: 0.5
