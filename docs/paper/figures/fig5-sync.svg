<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="480" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#111">图 5  虚实路由同步：虚实同步 + 转发控制同步（数字孪生闭环）</text>

  <!-- 虚拟侧 / 实物侧 -->
  <g stroke="#444" stroke-width="1">
    <rect x="60"  y="88" width="290" height="196" fill="#fbfbfb" rx="4"/>
    <rect x="470" y="88" width="310" height="196" fill="#fbfbfb" rx="4"/>
  </g>
  <text x="76"  y="108" font-size="12.5" font-weight="bold" fill="#111">虚拟侧：星座动力学模型（数字孪生）</text>
  <text x="486" y="108" font-size="12.5" font-weight="bold" fill="#111">实物侧：容器化路由器数字样机</text>

  <!-- 虚拟侧嵌套流水线 -->
  <g stroke="#ccc" stroke-width="1">
    <rect x="74" y="118" width="262" height="26" fill="#ffffff" rx="3"/>
    <rect x="74" y="152" width="262" height="26" fill="#ffffff" rx="3"/>
    <rect x="74" y="186" width="262" height="26" fill="#ffffff" rx="3"/>
  </g>
  <g font-size="9.8" fill="#333" text-anchor="middle">
    <text x="205" y="134">Walker 轨道递推（ECEF 星历）</text>
    <text x="205" y="168">三重判据：极区断链·视距·建链距离</text>
    <text x="205" y="202">时变虚拟拓扑 links.json</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="205" y1="144" x2="205" y2="150" marker-end="url(#arrow)"/>
    <line x1="205" y1="178" x2="205" y2="184" marker-end="url(#arrow)"/>
  </g>
  <text x="76" y="220" font-size="9" fill="#888">→ 每步推进 · 256 节点实时演算</text>

  <!-- 实物侧嵌套流水线 -->
  <g stroke="#ccc" stroke-width="1">
    <rect x="484" y="118" width="282" height="26" fill="#ffffff" rx="3"/>
    <rect x="484" y="152" width="282" height="26" fill="#ffffff" rx="3"/>
    <rect x="484" y="186" width="282" height="26" fill="#ffffff" rx="3"/>
  </g>
  <g font-size="9.8" fill="#333" text-anchor="middle">
    <text x="625" y="134">控制面 FRR / BIRD2 / OCRM（真实协议）</text>
    <text x="625" y="168">内核 IPv6 FIB</text>
    <text x="625" y="202">eBPF/XDP 转发面（SRv6 End）</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="625" y1="144" x2="625" y2="150" marker-end="url(#arrow)"/>
    <line x1="625" y1="178" x2="625" y2="184" marker-end="url(#arrow)"/>
  </g>
  <text x="486" y="220" font-size="9" fill="#888">→ 6 路 ISL · 真实 BGP 撤销 / 自愈</text>

  <!-- 虚实同步双箭头 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="350" y1="162" x2="468" y2="162" marker-end="url(#arrow)"/>
    <line x1="468" y1="212" x2="350" y2="212" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" fill="#444" text-anchor="middle">
    <text x="409" y="152">虚实同步（下发）：时延/通断 → tc netem + ip link up/down</text>
    <text x="409" y="232">观测回读（校验）：BGP 状态 / 转发路径采集</text>
  </g>

  <!-- 转发控制同步带 -->
  <text x="60" y="368" font-size="12.5" font-weight="bold" fill="#111">转发控制同步：控制面选路 → 转发面 FIB 一致性（控制/转发解耦）</text>
  <g stroke="#444" stroke-width="1" fill="#ffffff">
    <rect x="76"  y="388" width="150" height="34" rx="4"/>
    <rect x="250" y="388" width="170" height="34" rx="4"/>
    <rect x="444" y="388" width="150" height="34" rx="4"/>
    <rect x="618" y="388" width="150" height="34" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="151" y="409">bgpd / bird / OCRM 选路</text>
    <text x="335" y="409">zebra / CFML 下发</text>
    <text x="519" y="409">内核 IPv6 FIB</text>
    <text x="693" y="409">eBPF bpf_fib_lookup 命中</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="226" y1="405" x2="248" y2="405" marker-end="url(#arrow)"/>
    <line x1="420" y1="405" x2="442" y2="405" marker-end="url(#arrow)"/>
    <line x1="594" y1="405" x2="616" y2="405" marker-end="url(#arrow)"/>
  </g>

  <text x="76" y="448" font-size="10.5" fill="#555">控制面路由经 zebra/CFML 下发内核后，eBPF 数据面用 bpf_fib_lookup 直接命中，无需自维护路由 map——保证数字样机“测的是真实路由”。</text>
</svg>