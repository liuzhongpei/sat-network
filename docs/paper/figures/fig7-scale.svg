<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="360" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#111">图 7  可扩展性（以算力路由为例）：FIB 轨道面聚合与规模刻画</text>

  <!-- ============ 面板 (a) 聚合原理 ============ -->
  <text x="40" y="72" font-size="12" font-weight="bold" fill="#111">(a) FIB 轨道面聚合（O(N)→O(P)）</text>

  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="40" y="88" width="150" height="176" rx="4"/>
    <rect x="254" y="88" width="150" height="176" rx="4"/>
  </g>
  <text x="52" y="106" font-size="11" font-weight="bold" fill="#111">平面 p（N 颗卫星）</text>
  <text x="266" y="106" font-size="11" font-weight="bold" fill="#111">轨道面聚合后</text>

  <g stroke="#444" stroke-width="1" fill="#ffffff">
    <rect x="52"  y="118" width="126" height="24" rx="3"/>
    <rect x="52"  y="148" width="126" height="24" rx="3"/>
    <rect x="52"  y="178" width="126" height="24" rx="3"/>
    <rect x="52"  y="208" width="126" height="24" rx="3"/>
    <rect x="266" y="130" width="126" height="30" rx="3"/>
    <rect x="266" y="188" width="126" height="24" rx="3"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#333">
    <text x="115" y="134">sat0 /48（算力属性）</text>
    <text x="115" y="164">sat1 /48</text>
    <text x="115" y="194">sat2 /48</text>
    <text x="115" y="224">… satN /48</text>
    <text x="329" y="142">/32 聚合（含 N 个 /48）</text>
    <text x="329" y="150" font-size="8.8">＝ 1 条路由</text>
    <text x="329" y="204">例外卫星保留 /48</text>
  </g>

  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="190" y1="176" x2="252" y2="176" marker-end="url(#arrow)"/>
  </g>
  <text x="221" y="168" font-size="9" fill="#666" text-anchor="middle">聚合</text>

  <text x="40" y="288" font-size="10" fill="#555">每节点 FIB：由装全网 N 条 /48 降为装 P 个轨道面 /32（＋少量例外），P 为轨道面数；LPM 保证正确性。</text>
  <text x="40" y="304" font-size="10" fill="#555">控制面路由开销：0.03%（24 节点）→ 0.05%（1584 节点）——随规模亚线性增长。</text>

  <!-- ============ 面板 (b) 规模刻画 ============ -->
  <text x="440" y="72" font-size="12" font-weight="bold" fill="#111">(b) 每节点 FIB 表项 vs 网络规模（对数轴）</text>

  <!-- 坐标轴 -->
  <g stroke="#555" stroke-width="1">
    <line x1="452" y1="100" x2="452" y2="280"/>
    <line x1="452" y1="280" x2="780" y2="280"/>
  </g>

  <!-- Y 刻度 -->
  <g font-size="9" fill="#666">
    <text x="446" y="284" text-anchor="end">1</text>
    <text x="446" y="240" text-anchor="end">10</text>
    <text x="446" y="195" text-anchor="end">100</text>
    <text x="446" y="150" text-anchor="end">1000</text>
    <text x="446" y="104" text-anchor="end">10⁴</text>
  </g>
  <g stroke="#ccc" stroke-width="0.7">
    <line x1="452" y1="235" x2="780" y2="235"/>
    <line x1="452" y1="190" x2="780" y2="190"/>
    <line x1="452" y1="145" x2="780" y2="145"/>
    <line x1="452" y1="100" x2="780" y2="100"/>
  </g>

  <!-- X 刻度 -->
  <g font-size="9.5" fill="#444" text-anchor="middle">
    <text x="468" y="296">24</text>
    <text x="568" y="296">144</text>
    <text x="662" y="296">256</text>
    <text x="768" y="296">1584</text>
  </g>
  <text x="616" y="314" font-size="9.5" fill="#555" text-anchor="middle">网络规模 N（节点数）· 纵轴＝每节点 FIB 表项（条）</text>

  <!-- 聚合前 O(N) -->
  <polyline points="468,217.9 568,182.9 662,171.6 768,136" fill="none" stroke="#444" stroke-width="1.3"/>
  <!-- 聚合后 O(P) -->
  <polyline points="468,252.9 568,231.4 662,225.8 768,210.0" fill="none" stroke="#444" stroke-width="1.3" stroke-dasharray="5 3"/>
  <g fill="#444">
    <circle cx="468" cy="217.9" r="3"/><circle cx="568" cy="182.9" r="3"/><circle cx="662" cy="171.6" r="3"/><circle cx="768" cy="136" r="3"/>
    <circle cx="468" cy="252.9" r="3"/><circle cx="568" cy="231.4" r="3"/><circle cx="662" cy="225.8" r="3"/><circle cx="768" cy="210.0" r="3"/>
  </g>

  <!-- 图例 -->
  <g font-size="10" fill="#333">
    <line x1="500" y1="338" x2="520" y2="338" stroke="#444" stroke-width="1.3"/>
    <text x="526" y="342">聚合前：每星 /48（O(N)）</text>
    <line x1="646" y1="338" x2="666" y2="338" stroke="#444" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="672" y="342">聚合后：每面 /32（O(P)）</text>
  </g>
</svg>