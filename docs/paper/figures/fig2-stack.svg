<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#111">图 2  组件化路由协议栈（可插拔控制面 → 统一内核 FIB → 同一数据面）</text>

  <!-- 三栈（每栈内部再分两层子模块） -->
  <g stroke="#444" stroke-width="1">
    <rect x="58"  y="88" width="212" height="170" fill="#fbfbfb" rx="4"/>
    <rect x="304" y="88" width="212" height="170" fill="#fbfbfb" rx="4"/>
    <rect x="550" y="88" width="212" height="170" fill="#fbfbfb" rx="4"/>
  </g>

  <g font-size="13" font-weight="bold" fill="#111">
    <text x="74" y="106">FRR</text>
    <text x="320" y="106">BIRD2</text>
    <text x="566" y="106">OCRM（自研）</text>
  </g>

  <!-- 子模块：每栈两个内层盒子 -->
  <g stroke="#ccc" stroke-width="1">
    <rect x="68"  y="120" width="192" height="40" fill="#ffffff" rx="3"/>
    <rect x="68"  y="172" width="192" height="40" fill="#ffffff" rx="3"/>
    <rect x="314" y="120" width="192" height="40" fill="#ffffff" rx="3"/>
    <rect x="314" y="172" width="192" height="40" fill="#ffffff" rx="3"/>
    <rect x="560" y="120" width="192" height="40" fill="#ffffff" rx="3"/>
    <rect x="560" y="172" width="192" height="40" fill="#ffffff" rx="3"/>
  </g>
  <g font-size="10" fill="#333">
    <text x="77" y="134" font-weight="bold">bgpd / ospfd</text>
    <text x="77" y="149" font-size="8.8" fill="#666">BGP 决策 · OSPF SPF</text>
    <text x="77" y="186" font-weight="bold">zebra</text>
    <text x="77" y="201" font-size="8.8" fill="#666">RIB 选路 → 内核 FIB</text>

    <text x="323" y="134" font-weight="bold">bird（BGP）</text>
    <text x="323" y="149" font-size="8.8" fill="#666">ECMP merge paths</text>
    <text x="323" y="186" font-weight="bold">kernel 协议</text>
    <text x="323" y="201" font-size="8.8" fill="#666">direct / static / kernel</text>

    <text x="569" y="134" font-weight="bold">本体推理引擎</text>
    <text x="569" y="149" font-size="8.8" fill="#666">概念匹配 · 公理 · 约束</text>
    <text x="569" y="186" font-weight="bold">CFML 映射层</text>
    <text x="569" y="201" font-size="8.8" fill="#666">语义→FIB · KV-Cache · /32 聚合</text>
  </g>
  <g font-size="9.5" fill="#888">
    <text x="74" y="246">编号 eBGP（/127）</text>
    <text x="320" y="246">编号 eBGP（/127）</text>
    <text x="566" y="246">按算力/能量/寿命属性</text>
  </g>

  <text x="58" y="78" font-size="10.5" fill="#555">每星一个容器，同一份 eBPF 数据面；控制面内部各自分层，最终统一为内核 FIB 写入</text>

  <!-- 下箭头收敛 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="164" y1="258" x2="164" y2="282" marker-end="url(#arrow)"/>
    <line x1="410" y1="258" x2="410" y2="282" marker-end="url(#arrow)"/>
    <line x1="656" y1="258" x2="656" y2="282" marker-end="url(#arrow)"/>
  </g>

  <!-- 统一南向接口 -->
  <rect x="150" y="284" width="520" height="54" fill="#eef2f7" stroke="#444" stroke-width="1" rx="4"/>
  <text x="410" y="304" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">统一南向接口：内核 IPv6 FIB</text>
  <text x="410" y="322" font-size="10.5" text-anchor="middle" fill="#444">zebra 下发 ｜ bird kernel 协议 ｜ CFML 原子 ip -6 route replace</text>

  <line x1="410" y1="338" x2="410" y2="372" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 数据面 -->
  <rect x="150" y="376" width="520" height="54" fill="#fbfbfb" stroke="#444" stroke-width="1" rx="4"/>
  <text x="410" y="396" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111">同一可编程数据平面：eBPF/XDP 转发面</text>
  <text x="410" y="414" font-size="10.5" text-anchor="middle" fill="#444">bpf_fib_lookup 直查内核 FIB ｜ SRv6 End 源路由（控制面/转发面解耦）</text>

  <text x="150" y="462" font-size="10.5" fill="#555">注：另有 sonic-vs 节点模式，验证与真实 SONiC 控制面（SAI-VS 软件交换）的 BGP 互操作。</text>
</svg>