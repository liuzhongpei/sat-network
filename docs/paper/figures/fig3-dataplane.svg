<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#111">图 3  可编程数据平面（eBPF/XDP）处理流程</text>

  <!-- 主脊柱：收包 -->
  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="120" y="66" width="164" height="36" rx="4"/>
  </g>
  <text x="202" y="89" font-size="12" text-anchor="middle" fill="#111">收包（XDP 挂载 eth1..eth6）</text>

  <!-- 判据菱形 -->
  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="-52" y="-52" width="104" height="104" rx="10" transform="translate(202,142) rotate(45)"/>
    <rect x="-52" y="-52" width="104" height="104" rx="10" transform="translate(202,214) rotate(45)"/>
    <rect x="-52" y="-52" width="104" height="104" rx="10" transform="translate(202,284) rotate(45)"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#111">
    <text x="202" y="147">IPv6 ?</text>
    <text x="202" y="219">链路本地/</text>
    <text x="202" y="232">组播 ?</text>
    <text x="202" y="289">本地 Locator ?</text>
  </g>

  <!-- 快转 box -->
  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="108" y="360" width="188" height="62" rx="4"/>
  </g>
  <text x="202" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">普通 IPv6 快转</text>
  <text x="202" y="396" font-size="10.5" text-anchor="middle" fill="#333">bpf_fib_lookup 直查内核 FIB</text>
  <text x="202" y="410" font-size="10.5" text-anchor="middle" fill="#333">（BGP 路由经 zebra 已入 FIB）</text>

  <!-- 出接口 box -->
  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="108" y="462" width="188" height="50" rx="4"/>
  </g>
  <text x="202" y="480" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#111">MAC 改写 · hop_limit--</text>
  <text x="202" y="496" font-size="11.5" text-anchor="middle" fill="#111">bpf_redirect 出接口</text>

  <!-- 右侧分支 boxes -->
  <g stroke="#444" stroke-width="1" fill="#fbfbfb">
    <rect x="462" y="120" width="170" height="34" rx="4"/>
    <rect x="462" y="188" width="170" height="34" rx="4"/>
    <rect x="462" y="250" width="210" height="50" rx="4"/>
    <rect x="462" y="330" width="210" height="34" rx="4"/>
    <rect x="462" y="462" width="170" height="50" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="547" y="141">XDP_PASS（交内核协议栈）</text>
    <text x="547" y="209">XDP_PASS（BGP/ND/RA）</text>
    <text x="567" y="268" font-size="11" font-weight="bold" fill="#111">SRv6 End 处理</text>
    <text x="567" y="284" font-size="10">SL--，DA ← SegList[SL]</text>
    <text x="567" y="351">XDP_PASS（最终段/本地交付）</text>
    <text x="547" y="480" font-size="11">XDP_PASS</text>
    <text x="547" y="495" font-size="10.5">（内核慢路径兜底）</text>
  </g>

  <!-- 主脊柱箭头 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="202" y1="102" x2="202" y2="128" marker-end="url(#arrow)"/>
    <line x1="202" y1="174" x2="202" y2="198" marker-end="url(#arrow)"/>
    <line x1="202" y1="246" x2="202" y2="270" marker-end="url(#arrow)"/>
    <line x1="202" y1="306" x2="202" y2="358" marker-end="url(#arrow)"/>
    <line x1="202" y1="422" x2="202" y2="460" marker-end="url(#arrow)"/>
  </g>

  <!-- 分支箭头 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <!-- D1 否 -> P1 -->
    <line x1="276" y1="142" x2="460" y2="137" marker-end="url(#arrow)"/>
    <!-- D2 是 -> P2 -->
    <line x1="276" y1="214" x2="460" y2="205" marker-end="url(#arrow)"/>
    <!-- D3 是 -> S1 -->
    <line x1="276" y1="284" x2="460" y2="275" marker-end="url(#arrow)"/>
    <!-- S1 最终段 -> S2 -->
    <line x1="567" y1="300" x2="567" y2="328" marker-end="url(#arrow)"/>
    <!-- E 未命中 -> P4 -->
    <line x1="296" y1="400" x2="460" y2="487" marker-end="url(#arrow)"/>
  </g>

  <!-- S1 继续 FIB 回线 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <polyline points="570,296 570,406 300,406 300,391" marker-end="url(#arrow)"/>
  </g>

  <!-- 分支标签 -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="360" y="134">否</text>
    <text x="360" y="202">是</text>
    <text x="360" y="270">是</text>
    <text x="586" y="318">非 SRH / 最终段</text>
    <text x="376" y="396">未命中</text>
    <text x="534" y="398">SL&gt;0 继续 FIB 转发</text>
  </g>
  <text x="202" y="318" font-size="10" fill="#888" text-anchor="middle">否（非本地 Locator）</text>

  <!-- 底部注记：两张 map -->
  <g font-size="10.5" fill="#555">
    <text x="108" y="542">本地 Locator LPM map（/48，加载器写入）用于判定 End SID；统计 map（per-CPU）pin 到 bpffs，供观测层实时读取（数据平面可视化遥测）。</text>
  </g>
</svg>