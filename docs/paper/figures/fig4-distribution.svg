<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" font-family="sans-serif" font-size="13" fill="#222">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="420" fill="#ffffff"/>

  <text x="40" y="42" font-size="17" font-weight="bold" fill="#111">图 4  控制面数据分发服务与虚拟拓扑（借鉴 SDN 思想）</text>

  <!-- 三个层带 -->
  <g stroke="#444" stroke-width="1">
    <rect x="64" y="62"  width="740" height="84"  fill="#fbfbfb" rx="4"/>
    <rect x="64" y="162" width="740" height="118" fill="#fbfbfb" rx="4"/>
    <rect x="64" y="296" width="740" height="82"  fill="#fbfbfb" rx="4"/>
  </g>

  <!-- 左括号标签 -->
  <g stroke="#777" stroke-width="1" fill="none">
    <path d="M46,76 L28,76 L28,372 L46,372"/>
  </g>
  <text x="26" y="224" font-size="11.5" fill="#333" transform="rotate(-90 26 224)">控制面数据分发服务（SDN：控制/转发解耦 · 统一拓扑视图 · 统一南向接口）</text>

  <!-- ① 虚拟拓扑生成 -->
  <text x="80" y="86" font-size="12.5" font-weight="bold" fill="#111">① 虚拟拓扑生成（时变拓扑建模）</text>
  <g stroke="#444" stroke-width="1" fill="#ffffff">
    <rect x="80" y="98" width="136" height="34" rx="4"/>
    <rect x="236" y="98" width="136" height="34" rx="4"/>
    <rect x="392" y="98" width="136" height="34" rx="4"/>
    <rect x="548" y="98" width="148" height="34" rx="4"/>
    <rect x="716" y="98" width="72"  height="34" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="148" y="112">配置 yaml</text>
    <text x="148" y="126">（轨道/ISL/仿真参数）</text>
    <text x="304" y="119">orbit 轨道递推</text>
    <text x="460" y="119">isl +Grid 链路</text>
    <text x="622" y="112">addressing 编址</text>
    <text x="622" y="126">（/127·AS·SRv6 Locator）</text>
    <text x="752" y="119">links.json</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="216" y1="115" x2="234" y2="115" marker-end="url(#arrow)"/>
    <line x1="372" y1="115" x2="390" y2="115" marker-end="url(#arrow)"/>
    <line x1="528" y1="115" x2="546" y2="115" marker-end="url(#arrow)"/>
    <line x1="696" y1="115" x2="714" y2="115" marker-end="url(#arrow)"/>
  </g>

  <!-- ② 数据分发服务（南向） -->
  <text x="80" y="186" font-size="12.5" font-weight="bold" fill="#111">② 数据分发服务（南向闭环 · 借鉴 SDN 南向接口）</text>
  <g stroke="#444" stroke-width="1" fill="#ffffff">
    <rect x="80"  y="200" width="168" height="34" rx="4"/>
    <rect x="276" y="200" width="214" height="34" rx="4"/>
    <rect x="518" y="200" width="220" height="34" rx="4"/>
    <rect x="80"  y="248" width="320" height="26" rx="4"/>
    <rect x="432" y="248" width="306" height="26" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="164" y="214">链路动态引擎</text>
    <text x="164" y="227">（每仿真步推进）</text>
    <text x="383" y="221">三重判据：极区断链/视距/建链距离</text>
    <text x="628" y="214">下发真实网络状态</text>
    <text x="628" y="227">tc netem delay·rate + ip link</text>
    <text x="240" y="265">→ 每星容器真实转发面（veth/netns）</text>
    <text x="585" y="265">→ link_state.json（原子发布 tmp+rename）</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="248" y1="217" x2="274" y2="217" marker-end="url(#arrow)"/>
    <line x1="490" y1="217" x2="516" y2="217" marker-end="url(#arrow)"/>
    <line x1="628" y1="234" x2="628" y2="247" marker-end="url(#arrow)"/>
  </g>

  <!-- ③ 统一拓扑视图（北向） -->
  <text x="80" y="322" font-size="12.5" font-weight="bold" fill="#111">③ 统一拓扑视图（北向 · 观测/验证面）</text>
  <g stroke="#444" stroke-width="1" fill="#ffffff">
    <rect x="80"  y="336" width="170" height="34" rx="4"/>
    <rect x="272" y="336" width="230" height="34" rx="4"/>
    <rect x="524" y="336" width="260" height="34" rx="4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="165" y="357">统一拓扑状态 link_state.json</text>
    <text x="387" y="357">北向 API /api（meta·state·bgp·path）</text>
    <text x="654" y="350">星座轨迹/链路通断/BGP 事件流</text>
    <text x="654" y="363">转发路径实查 + 延迟/带宽实测</text>
  </g>
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="250" y1="353" x2="270" y2="353" marker-end="url(#arrow)"/>
    <line x1="502" y1="353" x2="522" y2="353" marker-end="url(#arrow)"/>
  </g>

  <!-- 层间箭头 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <line x1="434" y1="146" x2="434" y2="160" marker-end="url(#arrow)"/>
    <line x1="434" y1="280" x2="434" y2="294" marker-end="url(#arrow)"/>
  </g>

  <text x="80" y="406" font-size="10.5" fill="#555">南向把虚拟时延/通断同步为真实 netem/接口状态；北向以统一 link_state.json 提供一致拓扑视图，供观测与转发验证。</text>
</svg>